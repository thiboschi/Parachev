name: "Build & Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # permet de le lancer manuellement depuis l'onglet Actions

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"   # build universel (Intel + Apple Silicon)
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: "Parachev/package-lock.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # nécessaire uniquement pour le build universel macOS
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache des dépendances Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./Parachev/src-tauri -> target"

      - name: Installer les dépendances frontend
        working-directory: ./Parachev
        run: npm install

      - name: Build & publier avec Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./Parachev
          tagName: ${{ github.ref_name }}
          releaseName: "App v__VERSION__"
          releaseBody: "Voir les changements ci-dessous."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}